{% extends 'base.html' %}{% block title %}Delete product · Shop Coin{% endblock %}{% block content %}<div class="container app-shell py-5"><div class="form-panel text-center"><span class="feature-icon mx-auto"><i class="fa-solid fa-trash"></i></span><h1 class="h3 mt-3">Delete {{ product.name }}?</h1><p class="text-muted">This will remove the product from {{ product.shop.name }}.</p><form method="post" class="d-flex flex-column gap-2">{% csrf_token %}<button class="btn btn-danger btn-lg" type="submit">Delete product</button><a class="btn btn-outline-brand" href="{% url 'shops:products' %}">Cancel</a></form></div></div>{% endblock %}
